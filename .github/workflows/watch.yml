name: SS Car Watch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan depth (quick = 2 pages, deep = full)"
        type: choice
        options: [quick, deep]
        default: quick
  schedule:
    - cron: "25 * * * *"      # every hour, always quick

permissions:
  contents: write

concurrency:
  group: ss-car-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
            - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pyyaml python-dateutil
      - name: Choose scan depth
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="quick"; fi
          echo "SCAN_MODE=$MODE" >> "$GITHUB_ENV"
      - name: Run watcher
        run: python ss_watch.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ docs/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update ($(date -u '+%Y-%m-%d %H:%M UTC'), $SCAN_MODE)"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
